name: leam

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: leam-hourly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize old names to leam (first run only)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('.')
          # First-run migration from the already uploaded nested Leamstat directory.
          old=root/'Leamstat'
          if old.is_dir():
              for child in list(old.iterdir()):
                  if child.name in ('leam_Exporter','Darkleam_Exporter','darkleam_exporter'):
                      dst=root/'leam'
                  else:
                      dst=root/child.name
                  if dst.exists():
                      if child.is_dir() and dst.is_dir():
                          for entry in child.iterdir():
                              target=dst/entry.name
                              if not target.exists():shutil.move(str(entry),str(target))
                          shutil.rmtree(child)
                      elif child.name in ('README.md','README_RU.txt'):
                          child.unlink()
                      else:
                          raise RuntimeError('Destination already exists, refusing overwrite: '+str(dst))
                  else:
                      shutil.move(str(child),str(dst))
              old.rmdir()
          for folder in ('leam_Exporter','Darkleam_Exporter','darkleam_exporter'):
              src=root/folder
              if src.exists() and not (root/'leam').exists():src.rename(root/'leam')
          p=root/'leam'
          if not p.is_dir(): raise SystemExit('Could not locate existing exporter folder')
          # Normalize module names and internal archive filename references without altering character identity.
          renames={'leam_export.py':'leam.py','darkleam_export.py':'leam.py',
                   'stats_summary.py':'leam_stats.py','snapshot_compare.py':'leam_compare.py'}
          for before,after in renames.items():
              f=p/before
              if f.exists() and not (p/after).exists():f.rename(p/after)
          repl={
           'Darkleam_FULL_':'leam_full_',
           'Darkleam_ALL.json':'leam_all.json',
           'Darkleam_REPORT.txt':'leam_report.txt',
           'Darkleam_STATS_SUMMARY.csv':'leam_stats.csv',
           'Darkleam_STATS_DETAILS.csv':'leam_stat_details.csv',
           'Darkleam_STATS_SUMMARY.html':'leam_stats.html',
           'Darkleam_CHANGES.txt':'leam_changes.txt',
           'Darkleam_DAEVANION_AND_GEAR.html':'leam_boards.html',
           'Darkleam_ERROR.txt':'leam_error.txt',
           'GAME_STATS.csv':'leam_game_stats.csv',
           'from stats_summary import':'from leam_stats import',
           'from snapshot_compare import':'from leam_compare import',
          }
          for f in p.glob('*.py'):
              s=f.read_text('utf-8')
              for a,b in repl.items():s=s.replace(a,b)
              f.write_text(s,encoding='utf-8')
          # Replace the old publisher only if needed. On the first run the new leam_publish.py
          # is created from the tracked workflow's own template (in the second step).
          (root/'scripts').mkdir(exist_ok=True)
          # The old publisher will be regenerated under a unified leam name.
          legacy_publisher=root/'scripts/publish.py'
          if legacy_publisher.exists(): legacy_publisher.unlink()
          (root/'.gitignore').write_text("""__pycache__/
          *.py[cod]
          leam/leam_full_*.zip
          leam/leam_error.txt
          leam/leam_game_stats.csv
          *.tmp
          """, encoding='utf-8')
          (root/'README.md').write_text("""# leam

          Публичные данные персонажа **Darkleam** (Aion 2, EU Quai).

          Обновление: каждый час на 17-й минуте UTC через **Actions → leam**.

          Актуальный профиль: `data/leam.json`; сводка: `data/leam_stats.csv`; Даэванион: `data/leam_boards.html`.
          При ошибке API старая успешная выгрузка сохраняется. Git хранит историю изменений.

          Имя **Darkleam** в API — это имя персонажа, а **leam** — название проекта.
          """, encoding='utf-8')
          print('Leam naming migration OK')
          PY
      - name: Ensure leam publisher
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path=Path('scripts/leam_publish.py')
          if not path.exists():
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(base64.b64decode(''))
          print('Publisher:', path)
          PY
      - name: Fetch NCSOFT public character data
        run: python leam/leam.py
      - name: Validate and replace old snapshot
        run: python scripts/leam_publish.py
      - name: Commit current snapshot and renamed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'leam: hourly character snapshot'
            git push
          fi
