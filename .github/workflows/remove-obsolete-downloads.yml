name: Remove obsolete download branches
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-obsolete-downloads.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete download branches only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO" != "bdmwoosa777-coder/leamstat" ]]; then exit 1; fi
          refs=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name | select(startswith("downloads/"))')
          while IFS= read -r branch; do
            [[ "$branch" == downloads/* ]] || continue
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            printf 'Deleted %s\n' "$branch"
          done <<< "$refs"
